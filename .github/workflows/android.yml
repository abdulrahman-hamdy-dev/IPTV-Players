name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # هنا التغيير: هنستخدم gradle مباشرة بدل gradlew
      - name: Build with Gradle
        run: gradle build
        
