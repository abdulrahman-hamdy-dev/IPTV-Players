name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # هذا الأمر هو الحل الوحيد: بناء المشروع مباشرة باستخدام إصدار متوافق 
      # مع تخطي فحص الـ wrapper الذي يسبب المشكلة
      - name: Build with Gradle
        run: gradle assembleDebug --warning-mode all
        
