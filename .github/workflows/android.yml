name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.1
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
